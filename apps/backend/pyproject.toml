[project]
name = "plate-vision-backend"
version = "0.1.0"
description = "plate-vision Django API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "gunicorn>=23",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.8"]

# This is an application, not a distributable package: uv installs the
# dependencies but must not try to build the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
testpaths = ["jobs/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Django writes these; they are not hand-maintained source.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
