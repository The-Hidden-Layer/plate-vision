[project]
name = "plate-vision-ai-service"
version = "0.1.0"
description = "plate-vision inference service (stub implementation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pillow>=11",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
