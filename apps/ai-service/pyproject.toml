[project]
name = "plate-vision-ai-service"
version = "0.1.0"
description = "Iranian plate detection and recognition"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pillow>=11",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "psutil>=6",
    "python-multipart>=0.0.20",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
ml = ["torch>=2.8,<3", "torchvision>=0.23", "ultralytics>=8.4,<9"]
# Same stack with CPU-only PyTorch wheels: no multi-GB CUDA libraries. This is
# what the default Docker image installs; `ml` stays the CUDA build for NVIDIA.
cpu = ["torch>=2.8,<3", "torchvision>=0.23", "ultralytics>=8.4,<9"]
export = ["onnx>=1.17", "onnxslim>=0.1", "onnxruntime>=1.20"]

tensorrt = ["tensorrt>=10,<12; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.uv]
package = false
# Ultralytics uses cv2; the headless wheel supplies it without conflicting GUI files.
exclude-dependencies = ["opencv-python"]
conflicts = [[{ extra = "cpu" }, { extra = "ml" }], [{ extra = "cpu" }, { extra = "tensorrt" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
