# plate-vision — development topology.
#
#   cp .env.example .env && docker compose up --build
#
# Everything runs in containers: db, redis, backend (Django), worker (Celery),
# ai-service (FastAPI + trained LPD/LPR models on CPU) and frontend (Next.js).
# The model weights must be present in apps/ai-service/weights/{lpd,lpr}/best.pt
# (see apps/ai-service/weights/README.md). NVIDIA GPU hosts add
# -f docker-compose.nvidia.yml.
#
# All source is bind-mounted for hot reload. Two consequences the Dockerfiles
# must respect:
#   * Python images install their venv at /opt/venv (UV_PROJECT_ENVIRONMENT),
#     NOT inside /app — the bind mount would otherwise hide it.
#   * The frontend keeps node_modules and .next in anonymous volumes so the
#     host bind mount does not shadow what the image installed.

name: plate-vision

services:
  # ---------------------------------------------------------------- infra --
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432' # host access for psql / GUI clients
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save '' --appendonly no # demo broker: no persistence
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------ application ------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    entrypoint: ['/app/docker-entrypoint.sh']
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./apps/backend:/app
      - media:/app/media
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info --concurrency=1
    env_file: .env
    volumes:
      - ./apps/backend:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      backend:
        condition: service_healthy # backend applies migrations on start

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
      args:
        # CPU-only PyTorch: runs on any machine without pulling CUDA libraries.
        # GPU hosts use docker-compose.nvidia.yml instead.
        INSTALL_ML: cpu
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    env_file: .env
    environment:
      # Trained models by default; set LPD_BACKEND/LPR_BACKEND=stub in .env for
      # a model-free demo. Weights live in apps/ai-service/weights (bind-mounted).
      LPD_BACKEND: ${LPD_BACKEND:-model}
      LPR_BACKEND: ${LPR_BACKEND:-model}
      LPD_WEIGHTS: ${LPD_WEIGHTS:-/app/weights/lpd/best.pt}
      LPR_WEIGHTS: ${LPR_WEIGHTS:-/app/weights/lpr/best.pt}
      AI_DEVICE: ${AI_DEVICE:-cpu}
      AI_PRECISION: ${AI_PRECISION:-fp32}
      YOLO_CONFIG_DIR: /tmp/ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./apps/ai-service:/app
      - media:/app/media
    ports:
      - '8100:8100'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s # models load and warm up before /health answers

  frontend:
    build:
      context: . # repo root: needs pnpm-lock.yaml + pnpm-workspace.yaml
      dockerfile: apps/frontend/Dockerfile
    command: pnpm exec next dev --port 3000 --hostname 0.0.0.0
    working_dir: /app/apps/frontend
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN}
      # Surfaced to the browser so client-side validation matches the server.
      NEXT_PUBLIC_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      WATCHPACK_POLLING: 'true' # reliable file watching across the bind mount
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./libs:/app/libs
      - /app/node_modules # anonymous: keep the image's install
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/.next
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
  media: # shared by backend, worker and ai-service at /app/media
